name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          clang --version
          xcrun --show-sdk-path

      - name: Build
        run: clang -Wall -o test test.c

      - name: Run
        run: ./test
